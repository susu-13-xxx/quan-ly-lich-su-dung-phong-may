<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | RoomLab</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card">
    <a class="brand login-brand" th:href="@{/dashboard}"><span class="brand-mark">RL</span><span>RoomLab</span></a>
    <div class="eyebrow">HỆ THỐNG QUẢN LÝ PHÒNG MÁY</div>
    <h1>Chào mừng trở lại</h1><p class="muted">Đăng nhập để tiếp tục sử dụng hệ thống.</p>
    
    <form th:action="@{/login}" method="post">
        <label>Tên đăng nhập</label>
        <input
            type="text"
            name="username"
            placeholder="Nhập tên đăng nhập"
            required
    >
        <label>Mật khẩu</label>
        <input
            type="password"
            name="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <div th:if="${param.error}" class="login-hint">
            Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>

        <div th:if="${param.logout}" class="login-hint">
            Bạn đã đăng xuất thành công.
        </div>

        <button class="btn btn-primary full-width" type="submit">
            Đăng nhập
        </button>
    </form>

    <div id="recover" class="recover-note">Chức năng phục hồi mật khẩu sẽ được bổ sung ở bước xác thực tài khoản.</div>
    <p class="login-hint">RoomLab · Hệ thống quản lý phòng máy</p>
</div>
</body>
</html>
