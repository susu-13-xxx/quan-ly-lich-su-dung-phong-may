<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không có quyền truy cập | RoomLab</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
    <main class="login-card">
        <a class="brand login-brand" th:href="@{/dashboard}">
            <span class="brand-mark">RL</span>
            <span>RoomLab</span>
        </a>

        <div class="eyebrow">403 · ACCESS DENIED</div>
        <h1>Không có quyền truy cập</h1>
        <p class="muted">
            Tài khoản của bạn không được phép sử dụng chức năng này.
            Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ quản trị viên.
        </p>

        <a class="btn btn-primary full-width" th:href="@{/dashboard}">
            Quay về tổng quan
        </a>
    </main>
</body>
</html>
