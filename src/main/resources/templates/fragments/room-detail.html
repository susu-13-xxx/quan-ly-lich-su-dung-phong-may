<div th:fragment="content">
    <div class="card">
        <div class="section-heading">
            <div>
                <h2 th:text="${room.roomName}">Tên phòng</h2>
                <p>Thông tin chi tiết về phòng máy trong hệ thống.</p>
            </div>
            <a class="btn btn-light" th:href="@{/rooms}">
                ← Quay lại danh sách
            </a>
        </div>

        <div class="detail-list">
            <p><strong>Mã phòng:</strong> <span th:text="${room.roomId}"></span></p>
            <p><strong>Tên phòng:</strong> <span th:text="${room.roomName}"></span></p>
            <p><strong>Vị trí:</strong> <span th:text="${room.location != null ? room.location : 'Chưa cập nhật'}"></span></p>
            <p><strong>Sức chứa:</strong> <span th:text="${room.capacity}"></span> chỗ ngồi</p>
            <p><strong>Trạng thái:</strong> <span th:text="${room.status != null ? room.status : 'Chưa cập nhật'}"></span></p>
            <p><strong>Mô tả:</strong> <span th:text="${room.description != null ? room.description : 'Chưa có mô tả'}"></span></p>
            <p><strong>Ngày tạo:</strong>
                <span th:text="${room.createdAt != null ? #temporals.format(room.createdAt, 'dd/MM/yyyy HH:mm') : 'Chưa cập nhật'}"></span>
            </p>
        </div>
    </div>

    <div class="card" th:if="${brokenEquipments != null and !brokenEquipments.isEmpty()}">
        <div class="section-heading">
            <div>
                <h2>Thiết bị đang hỏng</h2>
                <p>Các thiết bị cần được kiểm tra hoặc sửa chữa tại phòng này.</p>
            </div>
            <span class="status-badge status-danger"
                  th:text="${brokenEquipments.size()} + ' thiết bị'"></span>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Tên thiết bị</th>
                    <th>Loại thiết bị</th>
                    <th>Số lượng</th>
                    <th>Mô tả</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipment : ${brokenEquipments}">
                    <td th:text="${equipment.equipmentName}"></td>
                    <td th:text="${equipment.equipmentType}"></td>
                    <td th:text="${equipment.quantity}"></td>
                    <td th:text="${equipment.description != null and !equipment.description.isBlank() ? equipment.description : 'Chưa có mô tả'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
