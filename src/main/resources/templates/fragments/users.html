<div th:fragment="content">

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
            <div>
                <h2>Danh sách người dùng</h2>
                <p>Quản lý tài khoản và vai trò truy cập hệ thống.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/users/new}">＋ Thêm người dùng mới</a>
        </div>

        <div th:if="${userCreated}" class="empty-panel" style="padding:14px; margin:16px 0; border-left:4px solid #16a34a;">
            <strong style="color:#15803d;">Tạo tài khoản mới thành công!</strong>
        </div>
        <div th:if="${userStatusSuccess}" class="alert alert-success" th:text="${userStatusSuccess}"></div>
        <div th:if="${userStatusError}" class="alert alert-error" th:text="${userStatusError}"></div>

        <div th:if="${#lists.isEmpty(users)}">
            <p>Hiện chưa có người dùng nào.</p>
        </div>

        <div th:unless="${#lists.isEmpty(users)}" style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.fullName}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.phone}"></td>
                        <td th:text="${user.roleName}"></td>
                        <td>
                            <span class="status-badge"
                                  th:text="${user.status == 'ACTIVE' ? 'Đang hoạt động' : 'Đã khóa'}"></span>
                        </td>
                        <td>
                            <form th:if="${user.roleName == 'TEACHER' or user.roleName == 'TECHNICIAN'}"
                                  method="post"
                                  th:action="@{/admin/users/{id}/status(id=${user.userId})}"
                                  style="display:flex; gap:8px; align-items:center;">
                                <select name="status" aria-label="Trạng thái tài khoản">
                                    <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">Mở khóa</option>
                                    <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">Khóa tài khoản</option>
                                </select>
                                <button type="submit" class="btn btn-outline btn-small">Lưu</button>
                            </form>
                            <span th:if="${user.roleName != 'TEACHER' and user.roleName != 'TECHNICIAN'}">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
